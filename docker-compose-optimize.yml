name: wwebjs-api-prod

volumes:
  redis-data:
  logs:

services:
  redis:
    image: redis:alpine
    container_name: wwebjs-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # Don't expose Redis publicly!
    # ports:
    #   - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.50"      # Max 50% of a CPU core
          memory: 256M      # Max 256 MB RAM
        reservations:
          cpus: "0.25"      # Reserve 25% of a CPU
          memory: 128M      # Reserve 128 MB RAM

  api:
    image: avoylenko/wwebjs-api:v1.33.2

    container_name: wwebjs-api
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SESSION_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_WEBHOOK_URL=http://localhost:3000/localCallbackExample
      - MAX_ATTACHMENT_SIZE=5000000 # In bytes (5MB)
      - SET_MESSAGES_AS_SEEN=TRUE
      - ENABLE_LOCAL_CALLBACK_EXAMPLE=TRUE
      - ENABLE_SWAGGER_ENDPOINT=TRUE
      - RECOVER_SESSIONS=TRUE

    ports:
      - "4000:3000"   # Expose API directly on port 80

    volumes:
      - ./sessions:/usr/src/app/sessions
      - ./logs:/usr/src/app/logs

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"     # Max 1 CPU core
          memory: 512M     # Max 512 MB RAM
        reservations:
          cpus: "0.50"     # Reserve 50% of a CPU
          memory: 256M     # Reserve 256 MB RAM
