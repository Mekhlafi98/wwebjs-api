# Hybrid approach: Use working image + external MongoDB
name: wwebjs-api-hybrid

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: wwebjs-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=wwebjs-api
    volumes:
      - mongodb_data:/data/db
    networks:
      - wwebjs-network

  # WhatsApp Web.js API (using working image)
  api:
    image: avoylenko/wwebjs-api:latest
    container_name: wwebjs-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Core Configuration
      - NODE_ENV=production
      - PORT=3000
      
      # API Security
      - API_KEY=your_secure_api_key_here
      
      # Webhook Configuration (using environment variables)
      - BASE_WEBHOOK_URL=http://localhost:3000/localCallbackExample
      - ENABLE_WEBHOOK=true
      - ENABLE_WEBSOCKET=false
      
      # Session Configuration
      - SESSIONS_PATH=/usr/src/app/sessions
      - AUTO_START_SESSIONS=false
      - RECOVER_SESSIONS=true
      
      # WhatsApp Web Configuration
      - MAX_ATTACHMENT_SIZE=10000000
      - SET_MESSAGES_AS_SEEN=false
      - HEADLESS=true
      - RELEASE_BROWSER_LOCK=true
      
      # Browser Configuration
      - CHROME_BIN=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      
      # Callback Configuration
      - DISABLED_CALLBACKS=message_ack|message_reaction
      
      # Swagger Documentation
      - ENABLE_SWAGGER_ENDPOINT=true
      
      # Rate Limiting
      - RATE_LIMIT_MAX=1000
      - RATE_LIMIT_WINDOW_MS=1000
      
      # Logging
      - LOG_LEVEL=info
      
      # Local Callback Example (for testing)
      - ENABLE_LOCAL_CALLBACK_EXAMPLE=true
      
      # Per-session webhooks using environment variables
      - CUSTOMER_SUPPORT_WEBHOOK_URL=https://webhook.site/your-customer-support-url
      - SALES_TEAM_WEBHOOK_URL=https://webhook.site/your-sales-team-url
      
    volumes:
      - sessions_data:/usr/src/app/sessions
    networks:
      - wwebjs-network
    depends_on:
      - mongodb

  # MongoDB Express (Web-based MongoDB admin interface)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: wwebjs-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password123@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    networks:
      - wwebjs-network
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
  sessions_data:
    driver: local

networks:
  wwebjs-network:
    driver: bridge
