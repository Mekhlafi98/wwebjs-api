version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: wwebjs-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: wwebjs-api
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - wwebjs-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo-express:
    image: mongo-express:1.0.2
    container_name: wwebjs-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wwebjs-network

  api:
    image: avoylenko/wwebjs-api:latest
    container_name: wwebjs-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=your_secure_api_key_here
      - BASE_WEBHOOK_URL=http://localhost:3000/localCallbackExample
      - ENABLE_WEBHOOK=true
      - ENABLE_WEBSOCKET=false
      - ENABLE_MONGODB=true
      - MONGO_URI=mongodb://admin:password123@mongodb:27017/wwebjs-api?authSource=admin
      - SESSIONS_PATH=/usr/src/app/sessions
      - AUTO_START_SESSIONS=false
      - RECOVER_SESSIONS=false
      - LOG_LEVEL=info
      - ENABLE_SWAGGER=true
      - SWAGGER_PATH=/api-docs
      - ENABLE_RATE_LIMIT=true
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - ENABLE_CORS=true
      - CORS_ORIGIN=*
      - ENABLE_HEALTH_CHECK=true
      - HEALTH_CHECK_PATH=/health
    volumes:
      - ./sessions:/usr/src/app/sessions
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wwebjs-network

volumes:
  mongodb_data:

networks:
  wwebjs-network:
    driver: bridge
